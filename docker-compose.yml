# 海洋微塑料显微视野拼接去重裁决服务
# 用法：
#   启动应用：            docker compose up --build app
#   自定义宿主机端口：     APP_PORT=9000 docker compose up --build app
#   一次性验收（构建+测试+API冒烟，以退出码结束）：
#                        docker compose up --build --exit-code-from verify verify
#                        或 docker compose run --rm verify
services:
  app:
    build: .
    image: microplastic-dedup:local
    environment:
      PORT: 8080
    ports:
      # 宿主机端口可通过环境变量 APP_PORT 配置（默认 8080）
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  verify:
    build: .
    image: microplastic-dedup:local
    # 一次性服务：自动执行构建检查、单元测试与 API 冒烟验收，以退出码结束
    command: ["node", "scripts/verify.js"]
    restart: "no"
